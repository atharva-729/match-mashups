# Story cut: Panthers @ Bengals 2014 W6 (37-37, OT), footage from nfl_mk_car_cin.
# The dramatized telling of "Nobody blinks" (stories/nfl_car_cin_blink.yaml): the same beats and plays, so the same
# clips; only the captions, title and song change. Same format: step = anchor play, show = extra plays around it,
# say = caption when the beat's footage starts, then = caption at the play's result.
# Captions still name every score the viewer doesn't see, so the scoreboard never jumps without a reason.
title: "No survivors"
line: "Two teams keep rising from the dead for 75 minutes. Then the last kick drifts wide."
# why this song: shown in big type beside the video and on the title card (the captions never mention the music)
why_song: "Danse Macabre: at midnight Death plays and the dead rise to dance. This game kept rising from the dead too. Every time one side was buried, it clawed back out. And when the dance ended, nobody was left standing."
# the story's turning beat lands on the song's turn (its biggest rise in energy), per length
turn: {60: 131, 120: 131}
# longer, more dramatic lines than the other story cuts (Atharva, 2026-11-16: "the captions may get a bit long")
max_words: 16
caption_max_s: 6.0
