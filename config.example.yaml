# Copy to config.yaml (gitignored) and point MATCH_REPO at your local clone of the sister repo
# (which-match-is-your-song, a.k.a. game-song-match / ipl-song-match). Relative paths resolve from this folder.
MATCH_REPO: ../ipl-song-match
# Python with numpy/pandas/librosa/easyocr etc. (see README Phase 0). Only used by run.py to launch the phases.
PYTHON: ~/.venvs/match-mashups/Scripts/python.exe
# Optional: the Soundtrack Engine repo (596 CC BY 4.0 Kevin MacLeod tracks + their energy curves), for v2 song search
SOUNDTRACK_REPO: ../soundtrack-engine
# Optional (v2 Phase 9): a Python with piper-tts for the voice-over (kept apart from the OCR's onnxruntime)
TTS_PYTHON: ~/.venvs/mm-tts/Scripts/python.exe
